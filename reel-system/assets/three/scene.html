<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: ReelBold; src: url(/font/bold); }
  @font-face { font-family: ReelReg; src: url(/font/reg); }
  html, body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  .lab { position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
         text-shadow: 0 4px 18px rgba(0,0,0,.55); }
  .val { font: 78px ReelBold; }
  .name { font: 40px ReelReg; transform: translate(-50%, 0); }
</style>
<script type="importmap">{"imports": {"three": "./build/three.module.min.js"}}</script>
</head>
<body>
<script type="module">
// Deterministic: nothing animates on its own. Python calls renderAt(t), t = 0..1
// across the shot, then screenshots. Beats are fractions of the shot, as in
// every other renderer, so a retimed shot cannot desync.
import * as THREE from 'three';
import { GLTFLoader } from './examples/jsm/loaders/GLTFLoader.js';

const S = window.SCENE;
const P = S.pal;
const clamp = x => Math.min(1, Math.max(0, x));
const win = (t, a, b) => clamp((t - a) / Math.max(b - a, 1e-6));
const outCubic = p => 1 - (1 - clamp(p)) ** 3;
const inOut = p => (p = clamp(p)) < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2;
const outBack = (p, s = 1.70158) => { p = clamp(p) - 1; return 1 + (s + 1) * p ** 3 + s * p ** 2; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(S.w, S.h);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(P.bg);
scene.fog = new THREE.Fog(P.bg, 22, 46);
const camera = new THREE.PerspectiveCamera(34, S.w / S.h, 0.1, 200);

scene.add(new THREE.HemisphereLight(P.fg, P.bg, 1.1));
const key = new THREE.DirectionalLight('#ffffff', 2.4);
key.position.set(6, 14, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
scene.add(key);
const rim = new THREE.DirectionalLight(P.accent, 3.0);   // the palette lives in the rim
rim.position.set(-8, 6, -10);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: P.bg, roughness: .9 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(120, 60, P.dim, P.dim);
grid.material.transparent = true;
grid.material.opacity = .28;
grid.position.y = .002;
scene.add(grid);

function label(cls, color) {
  const d = document.createElement('div');
  d.className = 'lab ' + cls;
  d.style.color = color;
  document.body.appendChild(d);
  return d;
}
function place(div, v3) {
  const p = v3.clone().project(camera);
  div.style.left = ((p.x + 1) / 2 * S.w) + 'px';
  div.style.top = ((1 - p.y) / 2 * S.h) + 'px';
}

let update;

if (S.kind === 'bars') {
  // The paid thing towers, the open one sits at zero. Bars grow staggered with a
  // small overshoot, the price counts up with them, the camera drifts round.
  const vals = S.bars.map(b => b.value);
  const max = Math.max(...vals, 1);
  const gap = 2.4, width = 1.5, tall = 5.2;
  const x0 = -(S.bars.length - 1) * gap / 2;
  const geo = new THREE.BoxGeometry(width, 1, width);
  geo.translate(0, .5, 0);
  const bars = S.bars.map((b, i) => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: b.value === 0 ? P.accent2 : P.accent, roughness: .32, metalness: .15 }));
    m.position.x = x0 + i * gap;
    m.castShadow = true;
    scene.add(m);
    return { m, h: Math.max(.06, b.value / max * tall), b,
             val: label('val', b.value === 0 ? P.accent2 : P.fg), name: label('name', P.fg) };
  });
  const [b0, b1] = S.beats;
  const per = (b1 - b0) / Math.max(bars.length, 1);
  update = t => {
    const e = inOut(t);
    // framed so the tallest bar plus its price stays inside the band all shot
    const ang = -.42 + .84 * e, r = 19 - 1.8 * e;
    camera.position.set(Math.sin(ang) * r, 4.6 - .6 * e, Math.cos(ang) * r);
    camera.lookAt(0, tall * .52, 0);
    camera.updateMatrixWorld();
    bars.forEach(({ m, h, b, val, name }, i) => {
      const p = win(t, b0 + i * per, b0 + (i + 1) * per + per * .4);
      const k = Math.max(.001, outBack(p, 1.4));
      m.visible = p > 0;                       // nothing on screen before its beat
      m.scale.y = h * k;
      val.textContent = S.prefix + Math.round(b.value * clamp(k)).toLocaleString('en-US') + S.suffix;
      val.style.opacity = p > 0 ? outCubic(p * 3) : 0;
      name.textContent = b.label;
      name.style.opacity = p > 0 ? outCubic(p * 3) : 0;
      place(val, new THREE.Vector3(m.position.x, h * k + .35, 0));
      place(name, new THREE.Vector3(m.position.x, 0, width * .9));
    });
  };
  window.READY = true;
}

if (S.kind === 'model') {
  // A turntable for a real object: the project's own CAD or scan export.
  new GLTFLoader().load('/model.glb', g => {
    const obj = g.scene;
    obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const s = 6 / Math.max(size.x, size.y, size.z);
    obj.scale.setScalar(s);
    const c = box.getCenter(new THREE.Vector3()).multiplyScalar(s);
    obj.position.set(-c.x, -box.min.y * s, -c.z);           // centred, standing on the ground
    const pivot = new THREE.Group();
    pivot.add(obj);
    scene.add(pivot);
    const h = size.y * s;
    update = t => {
      const e = inOut(t);
      pivot.rotation.y = S.turn * e;
      const r = 14 - 2.5 * e;                               // slow push in
      camera.position.set(r * .55, h * .55 + 3.2 - e, r);
      camera.lookAt(0, h * .45, 0);
    };
    window.READY = true;
  }, undefined, err => { window.FAILED = String(err && err.message || err); });
}

window.renderAt = t => { update(t); renderer.render(scene, camera); };
</script>
</body>
</html>
